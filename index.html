<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>メメントモリ ギルド分析</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:28px 18px 48px}header{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:20px}h1{margin:0;font-size:clamp(24px,4vw,38px)}.muted{color:#64748b;font-size:13px}.selectbox{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px #2130470d}.selectbox label{font-size:12px;color:#64748b;display:block;margin-bottom:4px}select{border:0;background:transparent;font-size:16px;font-weight:700;min-width:180px;outline:0}.grid{display:grid;grid-template-columns:340px 1fr;gap:18px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:18px;box-shadow:0 8px 24px #2130470d;overflow:hidden}.card h2{font-size:17px;margin:0;padding:18px 20px 5px}.card p{margin:0;padding:0 20px 12px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:10px 12px;border-top:1px solid #eef2f7;text-align:right;white-space:nowrap}th:nth-child(2),td:nth-child(2){text-align:left}tbody tr{cursor:pointer}tbody tr:hover{background:#f4f7fb}tbody tr.active{background:#fff1f2;color:#b91c1c;font-weight:700}.charts{display:grid;gap:18px}.chart{padding:0 14px 16px}.chart svg{display:block;width:100%;height:auto}.legend{display:flex;align-items:center;gap:8px;color:#64748b;font-size:12px;padding:0 20px 15px}.dot{width:22px;height:4px;border-radius:4px;background:#dc2626}.note{margin-top:16px;color:#64748b;font-size:12px}@media(max-width:820px){header{align-items:stretch;flex-direction:column}.grid{grid-template-columns:1fr}.selectbox{width:100%}select{width:100%}}
  </style>
</head>
<body><main class="wrap">
  <header><div><h1>メメントモリ ギルド分析</h1><div class="muted" id="updated">World 119・最終更新 2026/08/24 19:48</div></div><div class="selectbox"><label for="guild">注目ギルド</label><select id="guild"></select></div></header>
  <section class="grid"><div class="card"><h2>最新 TOP10</h2><p class="muted">行を押しても注目先を変更できます</p><div class="tablewrap"><table><thead><tr><th>順位</th><th>ギルド</th><th>人数</th><th>総戦闘力</th></tr></thead><tbody id="rows"></tbody></table></div></div>
  <div class="charts"><article class="card"><h2>総戦闘力推移</h2><div class="legend"><span class="dot"></span>選択中は赤い太線、その他は薄く表示</div><div class="chart" id="power"></div></article><article class="card"><h2>人数推移</h2><div class="chart" id="members"></div></article></div></section>
  <p class="note">現在は公開用プロトタイプです。表示の選択は閲覧者ごとのブラウザ内だけで変わり、元データには影響しません。</p>
</main><script>
let dates=['8/10','8/17','8/24'];
let guilds=[
['Divin Mage',[15040000000,16210000000,15041103741],[49,49,48]],['妖精郷',[12190000000,12190000000,12244940643],[42,42,43]],['天神雛子',[10750000000,11090000000,11255672839],[31,32,34]],['今宵ノ森',[11500000000,11150000000,11253763940],[33,33,49]],["7'Bridge",[9300000000,9900000000,10703876629],[36,38,39]],['プラチナ☆シャイン',[9200000000,9200000000,9841489606],[47,47,49]],['紅魔族の村',[9100000000,9300000000,9747321644],[44,44,45]],['静寂の森',[12200000000,12200000000,7977747716],[50,50,50]],['イオン産大根',[7500000000,7600000000,7848151931],[32,31,29]],['Re:六根清浄',[7500000000,7500000000,7768167853],[33,33,33]]];
const colors=['#2563eb','#f59e0b','#16a34a','#7c3aed','#ea580c','#0891b2','#4f46e5','#db2777','#65a30d','#0f766e'];let selected=0;
const fmt=n=>n.toLocaleString('ja-JP');
function chart(el,key,format){const w=760,h=270,p={l:70,r:20,t:18,b:42};const vals=guilds.flatMap(g=>g[key]).filter(v=>v!=null);let min=Math.min(...vals),max=Math.max(...vals);if(key===2){min=Math.max(0,Math.floor(min/10)*10-5);max=Math.ceil(max/10)*10}else{min=Math.floor(min/5e9)*5e9;max=Math.ceil(max/5e9)*5e9}const x=i=>p.l+i*(w-p.l-p.r)/(dates.length-1),y=v=>p.t+(max-v)*(h-p.t-p.b)/(max-min||1);let s=`<svg viewBox="0 0 ${w} ${h}" role="img">`;for(let i=0;i<5;i++){let v=min+(max-min)*i/4,yy=y(v);s+=`<line x1="${p.l}" y1="${yy}" x2="${w-p.r}" y2="${yy}" stroke="#e2e8f0"/><text x="${p.l-10}" y="${yy+4}" text-anchor="end" font-size="11" fill="#64748b">${format(v)}</text>`}guilds.forEach((g,i)=>{if(i===selected)return;s+=`<polyline points="${g[key].map((v,j)=>v==null?'':`${x(j)},${y(v)}`).join(' ')}" fill="none" stroke="${colors[i]}" stroke-width="1.5" opacity=".27"/>`});let g=guilds[selected];s+=`<polyline points="${g[key].map((v,j)=>v==null?'':`${x(j)},${y(v)}`).join(' ')}" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;g[key].forEach((v,i)=>{if(v!=null)s+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="#dc2626"/>`});dates.forEach((d,i)=>{let anchor=i===0?'start':i===dates.length-1?'end':'middle';s+=`<text x="${x(i)}" y="${h-14}" text-anchor="${anchor}" font-size="12" fill="#64748b">${d}</text>`});el.innerHTML=s+'</svg>'}
function render(){document.querySelectorAll('#rows tr').forEach((r,i)=>r.classList.toggle('active',i===selected));document.querySelector('#guild').value=selected;chart(document.querySelector('#power'),1,v=>(v/1e9).toFixed(1)+'B');chart(document.querySelector('#members'),2,v=>Math.round(v))}
const sel=document.querySelector('#guild'),rows=document.querySelector('#rows');
function setup(){selected=0;sel.innerHTML='';rows.innerHTML='';guilds.forEach((g,i)=>{sel.add(new Option(g[0],i));let last=g[1].length-1;rows.insertAdjacentHTML('beforeend',`<tr data-i="${i}"><td>${i+1}</td><td>${g[0]}</td><td>${g[2][last]??'-'}</td><td>${g[1][last]==null?'-':fmt(g[1][last])}</td></tr>`)});render()}
sel.onchange=e=>{selected=+e.target.value;render()};rows.onclick=e=>{let r=e.target.closest('tr');if(r){selected=+r.dataset.i;render()}};
setup();
fetch('data.json?'+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error();return r.json()}).then(data=>{dates=data.dates.map(d=>d.replace(/^\\d{4}\//,''));guilds=data.guilds.map(g=>[g.name,g.power,g.members]);document.querySelector('#updated').textContent=`World ${data.world}・最終更新 ${data.updated_at}`;setup()}).catch(()=>{});
</script></body></html>
